<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Обнаружение бутылок (YOLOv8n)</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #333; }
    .container {
      position: relative;
      width: 640px;
      height: 480px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }
    #status { margin-top: 10px; font-size: 16px; color: #666; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Обнаружение бутылок</h1>
  <div class="container">
    <video id="webcam" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="status">Загрузка AI модели...</div>

  <!-- onnxruntime-web -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');

    let session = null;
    const CONFIDENCE_THRESHOLD = 0.5;

    async function initCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
      return new Promise(resolve => {
        video.onloadedmetadata = () => {
          video.play();
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          resolve();
        };
      });
    }

    async function loadModel() {
      try {
        status.textContent = "Загрузка AI модели...";
        // ⚠️ модель yolov8n.onnx должна лежать рядом с index.html в репозитории
        session = await ort.InferenceSession.create("yolov8n.onnx", {
          executionProviders: ["webgpu", "wasm"]
        });
        status.textContent = "Модель успешно загружена ✅";
        setTimeout(() => status.classList.add("hidden"), 1000);
      } catch (e) {
        status.textContent = "Ошибка загрузки модели ❌";
        console.error("Ошибка:", e);
      }
    }

    function preprocess() {
      const size = 640;
      const tmpCanvas = document.createElement("canvas");
      tmpCanvas.width = size;
      tmpCanvas.height = size;
      const tmpCtx = tmpCanvas.getContext("2d");
      tmpCtx.drawImage(video, 0, 0, size, size);
      const imageData = tmpCtx.getImageData(0, 0, size, size).data;

      const input = new Float32Array(size * size * 3);
      for (let i = 0; i < size * size; i++) {
        input[i] = imageData[i * 4] / 255;
        input[i + size * size] = imageData[i * 4 + 1] / 255;
        input[i + size * size * 2] = imageData[i * 4 + 2] / 255;
      }
      return new ort.Tensor("float32", input, [1, 3, size, size]);
    }

    async function detect() {
      if (!session) return;
      try {
        const inputTensor = preprocess();
        const results = await session.run({ images: inputTensor });
        const output = results[Object.keys(results)[0]].data;
        renderPredictions(output);
      } catch (e) {
        console.error("Ошибка инференса:", e);
      }
      requestAnimationFrame(detect);
    }

    function renderPredictions(output) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // YOLOv8n ONNX вывод: [1,84,8400] -> приводим к [8400,84]
      let numAnchors, numAttrs;
      if (output.length % 84 === 0) {
        numAnchors = output.length / 84;
        numAttrs = 84;
      } else {
        console.error("Неизвестный формат выхода:", output.length);
        return;
      }

      for (let i = 0; i < numAnchors; i++) {
        const x = output[i * numAttrs + 0]; // центр X
        const y = output[i * numAttrs + 1]; // центр Y
        const w = output[i * numAttrs + 2];
        const h = output[i * numAttrs + 3];
        const objScore = output[i * numAttrs + 4];
        if (objScore < CONFIDENCE_THRESHOLD) continue;

        const classScores = output.slice(i * numAttrs + 5, i * numAttrs + 85);
        const maxScore = Math.max(...classScores);
        const classId = classScores.indexOf(maxScore);

        // Класс "bottle" в COCO = 39
        if (classId === 39 && maxScore * objScore > CONFIDENCE_THRESHOLD) {
          const cx = (x) * canvas.width / 640;
          const cy = (y) * canvas.height / 640;
          ctx.fillStyle = "lime";
          ctx.font = "32px sans-serif";
          ctx.fillText("✅", cx, cy);
        }
      }
    }

    (async () => {
      await initCamera();
      await loadModel();
      detect();
    })();
  </script>
</body>
</html>
